# Goose Playground on-prem stack. Started separately from the jace-s compose (D-0007).
# Build the run image first: docker build -t goose-run:v2026.4 ../runimage
name: goose-playground

services:
  hub:
    build: { context: ../server, target: hub }
    restart: unless-stopped
    environment:
      HUB_ADDR: ":8080"
      RUNNER_URL: "http://runner:8090"
      ALLOWED_ORIGINS: "https://goose-playground.jace-s.com"
      TURNSTILE_SECRET: "${TURNSTILE_SECRET:-}"
    networks:
      internal:
      gateway:
        aliases: [goose-hub]

  runner:
    build: { context: ../server, target: runner }
    restart: unless-stopped
    environment:
      RUNNER_ADDR: ":8090"
      RUNNER_IMAGE: "goose-run:v2026.4"
      RUNNER_RUNTIME: "${RUNNER_RUNTIME:-runsc}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Reachable only from the hub. The gateway network is never attached here.
    networks: [internal]

networks:
  internal:
    internal: true
  gateway:
    # Shared with the jace-s gateway nginx, which routes api.jace-s.com/goose/ to hub:8080.
    # The network name is settled together with the jace-s gateway change.
    external: true
    name: goose-gateway
